# SwapShelf - configuración
# Carpeta donde están tus juegos, con una subcarpeta por consola (snes, genesis, gba, gbc, gb, nes).
# Puede ser una ruta completa, por ejemplo D:\Roms
carpeta_roms=Roms
# Imagen del juego: normal | zadark-hd (también se cambia en la pausa del juego, Esc)
shader=zadark-hd
zhd_textura=1
zhd_bordes=2
zhd_vivo=3
# Ventana: 0 = ventana, 1 = pantalla completa (F11 cambia)
pantalla_completa=0
# Escala del juego: entero | ajustar | estirar
escala=ajustar
# Bordes a los costados del juego: tema | difuminado | negro
borde=difuminado
volumen=100
# Menús: tema oscuro | claro, y color de acento cian | rojo | verde | violeta | naranja
tema=oscuro
color=cian
# Idioma de los menús: es (español) | en (English) | pt (Português)
idioma=es
# Biblioteca: cartuchos por fila en cada consola (5 a 9; menos = más grandes)
por_fila=7
# Aumento del cartucho elegido, en % (100 = sin aumento, hasta 170)
aumento=130
# Al volver a abrir un juego, seguir donde lo dejaste: si | no
continuar=si
# Música del menú (opcional): un .mp3 tuyo, por ejemplo musica_menu=menu.mp3
musica_menu=
volumen_musica=20

# --- Portadas ---
# Clave de TheGamesDB (opcional). Si la dejas vacía se usa la que trae SwapShelf.
# Si pones la tuya, no la compartas: es personal.
thegamesdb_clave=
# Qué mostrar en la tarjeta: caja (portada de la caja si existe) | pantalla (pantalla de título)
portadas=caja
