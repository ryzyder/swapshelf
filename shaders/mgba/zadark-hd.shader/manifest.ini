[shader]
name=Zadark HD
author=Zadark (xBR-lv3: Hyllian, CAS: AMD)
description=Color remasterizado, bordes suaves, nitidez, resplandor y textura de pantalla. Niveles 1-4.
passes=3

[pass.0]
integerScaling=1
width=-4
height=-4
vertexShader=xbr.vs
fragmentShader=zhd-xbr.fs

[pass.0.uniform.ZHD_BORDES]
type=float
readableName=Bordes 1-4 (35-50 %)
default=2
min=1
max=4

[pass.0.uniform.ZHD_VIVO]
type=float
readableName=Vivo 1-4 (color)
default=3
min=1
max=4

[pass.0.uniform.XBR_Y_WEIGHT]
type=float
readableName=xBR Y Weight
default=48
min=0
max=100

[pass.0.uniform.XBR_EQ_THRESHOLD]
type=float
readableName=xBR Eq Threshold
default=10.0
min=0.0
max=50.0

[pass.0.uniform.XBR_EQ_THRESHOLD2]
type=float
readableName=xBR Eq Threshold2
default=2.0
min=0.0
max=4.0

[pass.0.uniform.XBR_LV2_COEFFICIENT]
type=float
readableName=xBR Lv2 Coefficient
default=2.0
min=1.0
max=3.0

[pass.1]
width=-4
height=-4
fragmentShader=zhd-cas.fs

[pass.1.uniform.ZHD_NITIDEZ]
type=float
readableName=Nitidez 0-100
default=60
min=0
max=100

[pass.1.uniform.ZHD_BRILLO]
type=float
readableName=Resplandor 0-100
default=22
min=0
max=100

[pass.2]
filter=1
width=0
height=0
fragmentShader=zhd-tex.fs

[pass.2.uniform.ZHD_TEXTURA]
type=float
readableName=Textura 1-4 (1 = sin textura)
default=1
min=1
max=4
